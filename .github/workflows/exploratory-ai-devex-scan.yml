name: Exploratory AI and DevEx job scan
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install
      - name: Configure anonymous exploratory search
        shell: bash
        run: |
          cat > portals.yml <<'YAML'
          title_filter:
            positive:
              - "Developer Experience"
              - "Developer Productivity"
              - "Engineering Productivity"
              - "AI Enablement"
              - "AI Productivity"
              - "Developer Tools"
              - "AI Platform"
              - "Agentic"
              - "AI Automation"
              - "Engineering Enablement"
              - "Developer Infrastructure"
              - "Internal Developer Platform"
              - "AI Engineering"
              - "Engineering Automation"
            negative:
              - "Intern"
              - "Graduate"
          location_filter:
            strict: true
            remote_title_fallback: false
            allow:
              - "Remote - US"
              - "Remote, US"
              - "Remote (US)"
              - "Remote (USA)"
              - "Remote - United States"
              - "Remote, United States"
              - "US Remote"
              - "USA Remote"
              - "United States - Remote"
              - "United States (Remote)"
              - "Anywhere in the US"
              - "Anywhere in the United States"
          YAML
      - name: Scan public ATS boards (no LLM, no CV)
        run: node scan-ats-full.mjs --ats greenhouse,lever,ashby,workday,icims,bamboohr --seeds yc,a16z --shuffle --limit 100 --since 14
      - name: Prepare public-posting-only digest
        if: always()
        shell: bash
        run: |
          mkdir -p scan-output
          if [ -f data/pipeline.md ]; then
            cp data/pipeline.md scan-output/public-job-postings.md
          else
            echo 'No pipeline file produced; inspect workflow logs.' > scan-output/README.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exploratory-ai-devex-postings
          path: scan-output/
          retention-days: 1
