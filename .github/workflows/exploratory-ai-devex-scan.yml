name: Exploratory AI and DevEx job scan (include undated diagnostic)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install
      - name: Configure anonymous exploratory search
        shell: bash
        run: |
          cat > portals.yml <<'YAML'
          title_filter:
            positive:
              - "Developer Experience"
              - "Developer Productivity"
              - "Engineering Productivity"
              - "AI Enablement"
              - "AI Productivity"
              - "Developer Tools"
              - "AI Platform"
              - "Agentic"
              - "AI Automation"
              - "Engineering Enablement"
              - "Developer Infrastructure"
              - "Internal Developer Platform"
              - "AI Engineering"
              - "Engineering Automation"
            negative:
              - "Intern"
              - "Graduate"
          location_filter:
            strict: true
            remote_title_fallback: false
            allow:
              - "Remote - US"
              - "Remote, US"
              - "Remote (US)"
              - "Remote (USA)"
              - "Remote - United States"
              - "Remote, United States"
              - "US Remote"
              - "USA Remote"
              - "United States - Remote"
              - "United States (Remote)"
              - "Anywhere in the US"
              - "Anywhere in the United States"
          YAML
      - name: Validate scanner and Remote US filter
        shell: bash
        run: |
          node --check scan-ats-full.mjs
          node --check seeds/vc-portfolios.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          import { buildLocationFilter } from './scan.mjs';
          import { loadYaml } from './lib/yaml-document.mjs';
          const config = loadYaml(readFileSync('portals.yml', 'utf8'));
          const accepts = buildLocationFilter(config.location_filter);
          for (const location of ['Remote - US', 'Remote (US)', 'Remote, United States']) {
            assert.equal(accepts(location, '', ''), true, location);
          }
          for (const location of ['', 'London', 'Bengaluru, India', 'Hybrid - New York', 'San Francisco, CA']) {
            assert.equal(accepts(location, '', 'Remote AI Engineer'), false, location);
          }
          console.log('Remote US location smoke tests passed');
          NODE
      - name: Scan public ATS boards (no LLM, no CV)
        run: node scan-ats-full.mjs --ats greenhouse,lever,ashby,workday,icims,bamboohr --seeds yc,a16z --shuffle --limit 100 --since 14 --include-undated --verbose
      - name: Prepare public-posting-only digest
        if: always()
        shell: bash
        run: |
          mkdir -p scan-output
          if [ -f data/pipeline.md ]; then
            cp data/pipeline.md scan-output/public-job-postings.md
          else
            echo 'No pipeline file produced; inspect workflow logs.' > scan-output/README.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exploratory-ai-devex-postings
          path: scan-output/
          retention-days: 1
