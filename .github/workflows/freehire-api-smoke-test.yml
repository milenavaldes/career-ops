name: Freehire API smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Query Freehire API
        run: python3 scripts/freehire_smoke_test.py
      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freehire-api-results
          path: freehire-results/
          if-no-files-found: warn
